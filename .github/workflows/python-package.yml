name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU-only PyTorch first for fast, lightweight CI builds
        pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,scratch,notebooks
        # Exit-zero treats all other stylistic errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,scratch,notebooks

    - name: Test with pytest
      env:
        PYTHONPATH: .
      run: |
        pytest

  clean-install-test:
    name: Clean Install & Pipeline Verification
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Verify Fresh Clean Environment Install
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Execute Isolated Unit Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -m unittest discover -s tests -p 'test_*.py'
